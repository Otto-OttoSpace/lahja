name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm test
      # dogfood: lahja must find its own seeded corpus (exit 1 = findings present)
      - run: node bin/lahja.js test/corpus/jsx-text-happy/input.tsx || true
